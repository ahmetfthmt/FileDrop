name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      remote_origin:
        description: 'HTTPS signaling server origin (e.g. https://your-app.run.app)'
        required: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and Capacitor Android
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets for remote origin
        env:
          VITE_REMOTE_ORIGIN: ${{ github.event.inputs.remote_origin }}
        run: |
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: file-drop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
